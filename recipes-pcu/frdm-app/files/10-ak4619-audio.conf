# PipeWire clock and ALSA tuning for AK4619 on shared SAI3 bus.
# Capture and playback share the same I2S interface; increase quantum
# and headroom to prevent xruns during full-duplex operation (SIP calls).
context.properties = {
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 1024
    default.clock.max-quantum   = 4096
}
