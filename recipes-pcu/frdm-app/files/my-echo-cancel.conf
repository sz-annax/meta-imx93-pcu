context.modules = [
  {   name = libpipewire-module-echo-cancel
      args = {
         library.name  = aec/libspa-aec-webrtc
         node.latency = 2048/48000

         # Use monitor mode: AEC reads playback reference from the default
         # sink's monitor ports instead of inserting its own sink+playback
         # pair into the graph. This avoids hijacking alsa_output and the
         # timing issues caused by capture+playback sharing the same SAI3/AK4619.
         monitor.mode = true

         webrtc.extended_filter     = true
         # Enable delay_agnostic: critical for monitor.mode where the
         # reference signal has variable latency vs the capture stream.
         webrtc.delay_agnostic      = true
         webrtc.noise_suppression   = true
         webrtc.high_pass_filter    = true
         webrtc.voice_detection     = false

         webrtc.gain_control        = false
         webrtc.experimental_agc    = false

         capture.props = {
            node.name = "Echo Cancellation Capture"
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
         }
         source.props = {
            node.name = "Echo Cancellation Source"
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
         }
      }
  }
]
