#@TYPE: Machine
#@NAME: LCD Display Platform (IM356-M-A)
#@SOC: i.MX6DL
#@DESCRIPTION: MCIMX6U6AVM08AC, 1 GiB DDR3, USDHC4 eMMC and USDHC2 microSD

MACHINEOVERRIDES =. "mx6:mx6dl:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv7a/tune-cortexa9.inc

IMX_DEFAULT_BSP = "nxp"
PREFERRED_PROVIDER_virtual/kernel = "linux-imx"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-imx"

KERNEL_DEVICETREE = "nxp/imx/imx6dl-imx6u-lcd.dtb"
SERIAL_CONSOLES = "115200;ttymxc0"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx6u_lcd_defconfig,sdcard"