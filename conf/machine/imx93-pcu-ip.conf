#@TYPE: Machine
#@NAME: NXP i.MX 93 PCU IP with phyCORE LPDDR4
#@SOC: i.MX93
#@DESCRIPTION: Machine configuration for NXP i.MX 93 11x11 phyCORE with 1GB LPDDR4
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

MACHINEOVERRIDES =. "mx93:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

MACHINE_FEATURES += "pci"
MACHINE_FEATURES:append:use-nxp-bsp = " optee"

# imx93-pcu-audio.dtb
KERNEL_DEVICETREE = " \
    freescale/imx93-pcu-audio.dtb \
    freescale/imx93-pcu-ip.dtb \
    freescale/imx93-pcu-recovery.dtb \
    freescale/imx93-pcu-ip-phytec.dtb \
"

UBOOT_DTB_NAME = "imx93-pcu-audio.dtb"

# IMX_DEFAULT_BOOTLOADER = "u-boot-imx-pcu"
PREFERRED_PROVIDER_virtual/kernel     = "linux-imx-pcu"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-imx-pcu"

LOADADDR = ""
UBOOT_SUFFIX = "bin"
UBOOT_MAKE_TARGET = ""

SPL_BINARY = "spl/u-boot-spl.bin"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd]   = "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"

# Set ATF platform name
ATF_PLATFORM = "imx93"

IMXBOOT_TARGETS = "flash_singleboot"

IMX_BOOT_SOC_TARGET = "iMX9"
IMX_BOOT_SEEK = "32"

# We have to disable SERIAL_CONSOLE due to auto-serial-console
SERIAL_CONSOLES = "115200;ttyLP0"

IMX_DEFAULT_BSP = "nxp"

UBOOT_CONFIG_BASENAME = "imx93_11x11_phycore"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"
