# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-imx93-pcu"
BBFILE_PATTERN_meta-imx93-pcu = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-imx93-pcu = "6"

LAYERDEPENDS_meta-imx93-pcu = "core"
LAYERSERIES_COMPAT_meta-imx93-pcu = "styhead"
