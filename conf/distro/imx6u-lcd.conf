require conf/distro/imx93-pcu.conf

DISTRO = "imx6u-lcd"
DISTRO_NAME = "ANNAX i.MX6DualLite LCD Distro"
LICENSE_FLAGS_ACCEPTED += "commercial"

PACKAGECONFIG:remove:pn-weston = "imxg2d"
PACKAGECONFIG:append:pn-weston = " egl opengl"
DEFAULTBACKEND:pn-weston-init = "fbdev"
PACKAGECONFIG:remove:pn-weston-init = "use-g2d use-pixman"

BBMASK += " \
    /meta-imx93-pcu/recipes-core/base-files/ \
    /meta-imx93-pcu/recipes-gopoint/ \
    /meta-imx93-pcu/recipes-multimedia/(chromium|onnxruntime)/ \
"
